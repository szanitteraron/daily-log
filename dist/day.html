/* ---------------- hill chart ---------------- */
const HW = 600, HH = 190, HX0 = 20, HX1 = 580, HBASE = 160, HAMP = 120;
const hillY = x => HBASE - HAMP * Math.exp(-Math.pow((x - 50) / 19, 2) / 2 * 2.2);
const hx = x => HX0 + (HX1 - HX0) * x / 100;
function hillSvg(P, big) {
  const scopes = hillScopes(P), pos = hillPositions(P);
  let d = ""; for (let x = 0; x <= 100; x += 1) d += `${x ? "L" : "M"}${hx(x).toFixed(1)},${hillY(x).toFixed(1)}`;
  const editable = DB.ready && DB.canEdit;
  const pts = scopes.map((s, i) => {
    const e = pos[s.id], x = state.hillMove?.scope === s.id ? state.hillMove.to : (e?.position ?? 0);
    const cls = state.hillMove?.scope === s.id ? "drag" : e?.status === "pending" ? "pending" : e?.status === "proposal" ? "proposal" : "";
    const cx = hx(x), cy = hillY(x), up = i % 2 === 0;
    return `<g class="pt ${cls}" data-scope="${esc(s.id)}" data-label="${esc(s.label)}" data-pos="${Math.round(x)}" tabindex="0" role="img" aria-label="${esc(s.label)}: ${Math.round(x)}" transform="translate(${cx.toFixed(1)},${cy.toFixed(1)})">
      <circle r="11"/><text class="num" y="4" text-anchor="middle">${i + 1}</text></g>`;
  }).join("");
  const legend = `<ol class="hl">${scopes.map((s, i) => { const e = pos[s.id], x = state.hillMove?.scope === s.id ? state.hillMove.to : (e?.position ?? 0);
    const edit = state.hillRen?.id === s.id && state.hillRen.where === (big ? "hillbig" : "hillmini");
    return `<li><span class="n">${i + 1}</span>${edit ? `<input class="hlren" data-hillren="${esc(s.id)}" value="${esc(state.hillRen.value ?? s.label)}" maxlength="80" aria-label="Munkaszál neve">` : `<span${DB.ready && DB.canEdit ? ` class="hlname" data-hlname="${esc(s.id)}" data-where="${big ? "hillbig" : "hillmini"}" title="Kattints az átnevezéshez" tabindex="0"` : ""}>${esc(s.label)}</span>`}</li>`; }).join("")}</ol>`;
  return `<div class="hill ${editable ? "editable" : ""} ${big ? "big" : ""}"><svg viewBox="0 20 ${HW} ${HH}" id="${big ? "hillbig" : "hillmini"}" aria-label="Hill chart">
    <line class="mid" x1="${hx(50)}" y1="${hillY(50)}" x2="${hx(50)}" y2="${HBASE}"/>
    <path class="curve" d="${d}"/><line x1="${HX0}" y1="${HBASE}" x2="${HX1}" y2="${HBASE}" stroke="var(--line)"/>
    <text x="${hx(22)}" y="${HBASE + 18}" text-anchor="middle">Kitaláljuk</text><text x="${hx(78)}" y="${HBASE + 18}" text-anchor="middle">Megcsináljuk</text>
    ${pts}</svg>${state.hillAdd?.where === (big ? "hillbig" : "hillmini") ? `<input class="hilladd" data-hilladd maxlength="80" placeholder="Új munkaszál neve, Enter" aria-label="Új munkaszál neve" value="${esc(state.hillAdd.value || "")}" style="left:${(state.hillAdd.fx * 100).toFixed(1)}%;top:${(state.hillAdd.fy * 100).toFixed(1)}%">` : ""}${legend}</div>`;
}

/* esedékesség-pötty (Mind Map, Tiszta lap, Kanban): szürke → narancs → piros → zöld (kész) → szürke.
   Narancs/piros a Backlogból vagy a Következikből a Folyamatban oszlopba visz; zöld = Kész (Asanában lezárva); zöldről visszanyitva Folyamatban. */
const urgOf = (P, t) => t.completed ? 3 : (MM.docs[mmId(P.id, "t:" + t.gid)]?.urg || 0);
function urgDot(P, t) {
  const u = urgOf(P, t);

}
async function urgCycle(P, t) {
  const k = "t:" + t.gid, cur = urgOf(P, t), nx = (cur + 1) % 4; UPD.gids.add(t.gid);
  if (!(DB.ready && DB.canEdit)) { toast("Ebben a nézetben nem menthető."); return; }
  if (nx === 3) { await mmPut(P, {[k]: {urg: 0}}, true); await moveTask(t, "Kész"); return; }
  if (nx === 0) { await mmPut(P, {[k]: {urg: 0}}, true); await moveTask(findTask(t.gid) || t, "Folyamatban"); return; }
  await mmDo([k], () => mmPut(P, {[k]: {urg: nx}}));
  if (t.section_name === "Backlog" || t.section_name === "Következik") moveTask(t, "Folyamatban");
}

/* ---------------- Haladás: munkaszál-idővonal és összesített készültség ----------------
   Készültség = a hill-pozícióból (10%-ra kerekítve, „kb.”); időtartam = tervdátum (repó vagy felületen rögzítve) vagy a
   munkaszálhoz kötött Asana-feladatok dátumai. Elvárt készültség és várható befejezés csak ott, ahol van hozzá dátum. */
const PLAN = {events: []};
const ST_L = {notstarted: "Nem kezdődött", figuring: "Kitalálás", doing: "Megvalósítás", done: "Kész"};
/* határidő jellege: kemény (oka szerint), saját/puha, becslés, tisztázatlan */
const DL_T = {hard: "Kemény határidő", soft: "Saját (puha) határidő", estimate: "Becslés", unclear: "Tisztázatlan"};
const DL_R = {legal: "Jogszabályi", contract: "Szerződéses", commitment: "Tett vállalás", management: "Vezetés által előírt", dependency: "Függőségi", event: "Külső esemény / naptári"};
const dlChip = k => k?.type ? `<span class="dlk ${esc(k.type)}" title="${esc([DL_T[k.type], k.type === "hard" && DL_R[k.reason], k.note].filter(Boolean).join(" · "))}">${esc(k.type === "hard" ? (DL_R[k.reason] ? "Kemény · " + DL_R[k.reason] : "Kemény") : DL_T[k.type])}</span>` : "";
function planOf(P) {
  const out = {};
  for (const s of hillScopes(P)) if (s.plan) out[s.id] = {start: s.plan.start || null, end: s.plan.end || null, kind: s.plan.end_kind || null, src: "repo"};
  if (P.page.target_end) out.__project = {end: P.page.target_end, kind: P.page.target_end_kind || null, src: "repo"};
  for (const e of PLAN.events) if (e.project === P.id) out[e.scope] = {start: e.start || null, end: e.end || null, kind: e.end_type ? {type: e.end_type, reason: e.end_reason || undefined, note: e.end_note || undefined} : (out[e.scope]?.kind || null), src: "ui", by: e.by, at: e.at};
  return out;
}
function scopeStats(P) {
  const sv = state.mm?.blank; if (sv) state.mm.blank = false;   // a tiszta lap szűrése ne torzítsa a statisztikát
  const pos = hillPositions(P), plan = planOf(P), G = mmGraph(P), tasks = tasksOf(P); if (sv) state.mm.blank = sv;
  return hillScopes(P).map(s => {
    const hp = pos[s.id]?.position ?? 0;
    const ts = tasks.filter(t => mmBranchOf(G.nodes, "t:" + t.gid) === s.label);
    const ds = ts.flatMap(t => [t.start_on, t.created_at, t.due_on]).filter(Boolean).sort();
    const status = hp >= 95 ? "done" : hp >= 50 ? "doing" : (hp > 3 || ts.some(t => t.completed)) ? "figuring" : "notstarted";
    return {s, hp, pct: Math.round(hp / 10) * 10, status, ts, done: ts.filter(t => t.completed).length, first: ds[0] || null, last: ds[ds.length - 1] || null, plan: plan[s.id] || null};
  });
}
function planForm(P, key, cur) {
  if (state.planEdit !== key) return "";
  return `<div class="planf" data-planf="${esc(key)}">${key === "__project" ? "" : `<label>Kezdés <input type="date" name="start" value="${esc(cur?.start || "")}"></label>`}
    <label>${key === "__project" ? "Céldátum" : "Befejezés"} <input type="date" name="end" value="${esc(cur?.end || "")}"></label>
    <label>Jellege <select name="end_type" data-dltype><option value="">— nincs megadva —</option>${Object.entries(DL_T).map(([k, v]) => `<option value="${k}" ${cur?.kind?.type === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <label class="dlr" ${cur?.kind?.type === "hard" ? "" : "hidden"}>Oka <select name="end_reason"><option value="">— válassz —</option>${Object.entries(DL_R).map(([k, v]) => `<option value="${k}" ${cur?.kind?.reason === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <label class="dln">Ki szabta / megjegyzés <input type="text" name="end_note" maxlength="160" value="${esc(cur?.kind?.note || "")}" placeholder="pl. NAV-határidő; Zolival egyeztetve"></label>
    <button class="btn primary" data-plan="save">Rögzítem</button><button class="btn" data-plan="cancel">Mégse</button>
    <span class="hint">Felületen rögzül, a repó-szinkronnál a page.yaml-ba kerül.</span></div>`;
}
function scopeTimeline(P) {
  const st = scopeStats(P), plan = planOf(P), canEdit = DB.ready && DB.canEdit, t0 = d2n(TODAY);
  const ns = st.flatMap(x => [x.plan?.start, x.plan?.end, x.first, x.last]).filter(Boolean).map(d2n);
  if (plan.__project?.end) ns.push(d2n(plan.__project.end));
  const lo = Math.min(t0 - 14, ...ns) - 3, hi = Math.max(t0 + 30, ...ns) + 5;
  const W = 520, X = n => (n - lo) / (hi - lo) * W;
  let ticks = "";
  for (let n = lo; n <= hi; n++) { const dt = new Date(n * 864e5); if (dt.getUTCDate() === 1) ticks += `<line x1="${X(n)}" y1="0" x2="${X(n)}" y2="100%" class="tk"/><text x="${X(n) + 3}" y="11" class="tkl">${HU_M[dt.getUTCMonth()]}</text>`; }
  const rows = st.map((x, i) => {
    const pl = x.plan, aS = pl?.start || x.first, aE = pl?.end || (x.status === "done" ? x.last : null);
    let bar = "";
    if (aS) {
      const s0 = d2n(aS), e0 = aE ? d2n(aE) : Math.max(t0, x.last ? d2n(x.last) : t0), x0 = X(s0), w = Math.max(6, X(e0 + 1) - x0);
      bar = `<rect x="${x0}" y="8" width="${w}" height="12" rx="6" class="sb ${pl?.end ? "" : "open"}"/><rect x="${x0}" y="8" width="${w * x.pct / 100}" height="12" rx="6" class="sf ${x.status}"/>`;
      if (!pl?.end) bar += `<text x="${x0 + w + 4}" y="18" class="tkl">nincs vége</text>`;
    } else bar = `<text x="4" y="18" class="tkl">nincs tervdátum és bekötött feladat</text>`;
    return `<div class="str"><div class="stl"><b>${esc(x.s.label)}</b><span class="sst ${x.status}">${ST_L[x.status]}</span>
        <span class="hint">kb. ${x.pct}%${x.ts.length ? ` · ${x.done}/${x.ts.length} feladat kész` : ""}${pl ? ` · terv: ${pl.start ? fmtD(pl.start) : "?"} – ${pl.end ? fmtD(pl.end) : "?"}${pl.src === "ui" ? " (felületen)" : ""}` : ""}</span>${pl?.end ? dlChip(pl.kind) : ""}
        ${canEdit ? `<button class="lnk" data-planedit="${esc(x.s.id)}">${pl ? "terv módosítása" : "tervdátum megadása"}</button>` : ""}</div>
      <svg class="sts" viewBox="0 0 ${W} 28" preserveAspectRatio="none"><g>${bar}</g><line x1="${X(t0 + 0.5)}" y1="0" x2="${X(t0 + 0.5)}" y2="28" class="td"/></svg>${planForm(P, x.s.id, pl)}</div>`;
  }).join("");
  return `<div class="panel" style="padding:14px"><div class="sec-h"><h3>Munkaszálak időben</h3>${info("scopetl")}</div>
    <svg class="sts" viewBox="0 0 ${W} 14" preserveAspectRatio="none" style="height:14px">${ticks}<line x1="${X(t0 + 0.5)}" y1="0" x2="${X(t0 + 0.5)}" y2="14" class="td"/></svg>
    ${rows}<div class="hint" style="margin-top:8px">Sáv = tervezett időszak (ha nincs, a bekötött feladatok első dátumától máig); kitöltés = kb. készültség a hill-pozícióból; függőleges vonal = ma.</div></div>`;
}
function overallBar(P) {
  const st = scopeStats(P); if (!st.length) return "";
  const plan = planOf(P), t0 = d2n(TODAY), canEdit = DB.ready && DB.canEdit;
  const act = Math.round(st.reduce((a, x) => a + x.hp, 0) / st.length / 5) * 5;
  const starts = st.flatMap(x => [x.plan?.start, x.first]).filter(Boolean).sort();
  const start = starts[0] || null, end = plan.__project?.end || st.map(x => x.plan?.end).filter(Boolean).sort().pop() || null;
  const exp = start && end && d2n(end) > d2n(start) ? Math.max(0, Math.min(100, Math.round((t0 - d2n(start)) / (d2n(end) - d2n(start)) * 100 / 5) * 5)) : null;
  const fc = start && act >= 10 && act < 100 && t0 > d2n(start) ? n2d(d2n(start) + (t0 - d2n(start)) / (act / 100)) : null;
  const gap = exp != null ? act - exp : null;
  const cls = gap == null ? "" : gap > 5 ? "ahead" : gap >= -5 ? "ontrack" : gap >= -20 ? "warn" : "bad";

function tabDeps(P) {

document.addEventListener("click", async e => {
  const dvb = e.target.closest?.("[data-dview]"); if (dvb) { state.dview = dvb.dataset.dview; state.dpAdd = state.dpEdit = null; render(); return; }
  const b = e.target.closest?.("[data-dp]"); if (!b) return;
  const panel = b.closest("[data-dplist]"); if (!panel) return;
  const list = panel.dataset.dplist, a = b.dataset.dp, li = b.closest("[data-dkey]"), x = li && depOf(page(), list).find(i => i.key === li.dataset.dkey);
  if (a === "check" && x) { e.preventDefault(); await depOp(list, "check", x.key, {on: !x.on, label: x.label}); return; }
  if (a === "dot" && x) { await depOp(list, "dot", x.key, {dot: TK_DOTS[(TK_DOTS.indexOf(x.dot) + 1) % TK_DOTS.length]}); return; }
  if (a === "edit" && x) { state.dpEdit = {list, key: x.key}; state.dpAdd = null; render(); dpFocus(); return; }
  if (a === "del" && x) { if (!confirmDel("dp" + x.key)) { toast("Még egy kattintás a kukára: törlés."); return; } if (await depOp(list, "delete", x.key, {label: x.label})) toast("Törölve."); return; }
  if (a === "add") { state.dpAdd = list; state.dpEdit = null; render(); dpFocus(); return; }
  if (a === "cancel") { state.dpAdd = state.dpEdit = null; render(); return; }
  if (a === "save") dpSave(b.closest("[data-dpform]"), list);
});
function dpFocus() { const f = document.querySelector('[data-dpform] input[data-dpf="label"]') || document.querySelector('[data-dpform] [data-dpf="note"]'); f?.focus(); f?.setSelectionRange?.(f.value.length, f.value.length); }
async function dpSave(form, list) {
  if (!form) return;
  const v = k => form.querySelector(`[data-dpf="${k}"]`)?.value.trim(), key = form.dataset.dpform;
  const label = v("label"), note = v("note") ?? "", date = v("date"), theme = v("theme");
  if (key === "new") {
    if (!label) { toast("Adj meg megnevezést, vagy kattints a Mégse gombra."); return; }
    const nk = list === "systems" ? "x:" + label : list === "people" ? (personId(label) || "n:" + label) : list === "events" ? "e:" + label : list === "projects" ? (D.pages.find(p => p.id === label || p.portfolio.name === label)?.id || label) : list === "constraints" ? "c-" + Date.now().toString(36) : label;
    const cur = depOf(page(), list).find(i => i.key === nk);
    if (cur) { if (!cur.on) await depOp(list, "check", nk, {on: true, label: cur.label}); if (note) await depOp(list, "note", nk, {note}); state.dpAdd = null; render(); toast("Már a listán volt: bejelöltem."); return; }
    if (await depOp(list, "add", nk, {label, note, ...(date != null ? {date} : {}), ...(theme ? {theme} : {})})) { state.dpAdd = null; toast("Hozzáadva."); }
    return;
  }
  const x = depOf(page(), list).find(i => i.key === key); if (!x) return;
  if (x.custom) { const ch = {}; if (label != null && label && label !== x.label) ch.label = label; if (note !== x.note && list !== "constraints") ch.note = note; if (date != null && date !== (x.date || "")) ch.date = date; if (theme && theme !== x.group) ch.theme = theme;
    if (Object.keys(ch).length) await depOp(list, "edit", key, ch); }
  else if (note !== x.note) await depOp(list, "note", key, {note, label: x.label});
  state.dpEdit = null; render();
}
document.addEventListener("keydown", e => {
  if (!e.target.closest?.("[data-dpform]")) return;
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey || e.target.tagName === "INPUT")) { e.preventDefault(); e.target.closest("[data-dpform]").querySelector('[data-dp="save"]')?.click(); }
  else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); state.dpAdd = state.dpEdit = null; render(); }

/* ---------------- Ma: napi nézet ----------------
   Bal oldal: mai célok + napszakok, hierarchikus checkbox-listával. Jobb oldal: esedékes(nek vélt) feladatok projektenként, prioritással; onnan húzható.
   Tár: data/plan/day/<ÉÉÉÉ-HH-NN> — a napi beosztás (nem forrásadat). A feladat forrása az Asana: a napi tétel gid-del hivatkozik rá, nem duplikál.
   Új napi tétel: ha már létezik ilyen feladat, ahhoz kötjük; ha nem, az Asanában jön létre (és a projekt története bejegyzést kap) — vagy „csak napi” tétel marad. */
const DAY_SECS = [["reggel", "Reggel"], ["vonat1", "Reggeli vonatút"], ["delelott", "Délelőtt"], ["del", "Dél"], ["delutan", "Délután"], ["vonat2", "Vonatút haza"], ["este", "Este"]];
const DAY_OPT = {vonat1: "delelott", vonat2: "este"};   // napi szinten kikapcsolható napszakok (nem utazós nap) → tételeik ide kerülnek
const DAY = {doc: null, all: {}, ready: false};
const DAYC = (() => { try { return new Set(JSON.parse(localStorage.getItem("day-closed") || "[]")); } catch { return new Set(); } })();
const dayEmpty = () => ({date: TODAY, goals: [], secs: Object.fromEntries(DAY_SECS.map(([k]) => [k, []]))});
const dayDoc = () => { if (!DAY.doc) DAY.doc = dayEmpty(); for (const [k] of DAY_SECS) DAY.doc.secs[k] ||= []; DAY.doc.goals ||= []; DAY.doc.off ||= []; return DAY.doc; };
const dayNid = () => "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const dayLists = d => [d.goals, ...DAY_SECS.map(([k]) => d.secs[k])];
function dayWalk(list, fn, parent = null) { for (let i = 0; i < list.length; i++) { if (fn(list[i], list, i, parent) === false) return false; if (list[i].kids?.length && dayWalk(list[i].kids, fn, list[i]) === false) return false; } }
function dayFind(id, d = dayDoc()) { let hit = null; for (const l of dayLists(d)) { dayWalk(l, (it, list, i, parent) => { if (it.id === id) { hit = {it, list, i, parent}; return false; } }); if (hit) break; } return hit; }
function dayHasGid(gid, d = dayDoc()) { let f = false; for (const l of dayLists(d)) dayWalk(l, it => { if (it.gid === gid) { f = true; return false; } }); return f; }
function daySave() {
  if (!(DB.ready && DB.canEdit)) { toast("Ebben a nézetben a napi terv nem menthető."); return; }
  const d = dayDoc(); d.date = TODAY; d.at = new Date().toISOString();
  DB.db.collection("data/plan/day").doc(TODAY).set(JSON.parse(JSON.stringify(d))).catch(err => toast(`A napi terv mentése nem sikerült (${err?.code || "hiba"}).`));
}
function dayTask(gid) { for (const P of D.pages) { const t = tasksOf(P).find(x => x.gid === gid); if (t) return {t, P}; } return null; }
function dayAllTasks() { const seen = new Set(), out = []; for (const P of D.pages) for (const t of tasksOf(P)) if (!seen.has(t.gid)) { seen.add(t.gid); out.push({t, P}); } return out; }

/* duplikátum-keresés: szóhalmaz-átfedés (ékezet- és írásjel-független), a tartalmazást is figyelembe véve */
const dayNorm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(w => w.length > 2);
function dayDup(text) {
  const a = new Set(dayNorm(text)); if (!a.size) return null;
  let best = null;
  for (const {t, P} of dayAllTasks()) {
    if (t.completed) continue;
    const b = new Set(dayNorm(t.name)); if (!b.size) continue;
    const inter = [...a].filter(w => b.has(w)).length, sc = Math.max(inter / (a.size + b.size - inter), inter / Math.min(a.size, b.size) * 0.85);
    if (!best || sc > best.sc) best = {sc, t, P};
  }
  return best && best.sc >= 0.45 ? best : null;
}

/* jobb oldal: esedékes(nek vélt) feladatok — lejárt, ma/3 napon belül esedékes, piros/narancs pötty, folyamatban vagy elakadt */
const PRIO_W = {high: 0, medium: 1, low: 2, unknown: 3};
const DAY_TOPN = 3, DAYMORE = new Set();   // projektenként a 3 legsürgősebb látszik, a többi a „További feladatok” mögött
function dayTop(g) {   // a már mai tervben lévők a sor végére, hogy a 3 hely a még nem tervezett, legsürgősebb feladatoké legyen
  const xs = [...g.items].sort((a, b) => (dayHasGid(a.t.gid) - dayHasGid(b.t.gid)) || a.p - b.p || (a.t.due_on || "9").localeCompare(b.t.due_on || "9"));
  return DAYMORE.has(g.P.id) ? xs : xs.slice(0, DAY_TOPN);
}
function dayCands() {
  const soon = n2d(d2n(TODAY) + 3), groups = [];
  for (const P of D.pages) {
    const items = [];
    for (const t of tasksOf(P)) {
      if (t.completed) continue;
      const u = urgOf(P, t), late = isLate(t), due = t.due_on;
      const p = late || u === 2 || due === TODAY ? 1 : (due && due <= soon) || u === 1 ? 2 : ["Folyamatban", "Elakadt"].includes(t.section_name) ? 3 : 0;
      if (!p) continue;
      const why = late ? "lejárt" : u === 2 ? "sürgős (piros)" : due === TODAY ? "ma esedékes" : due && due <= soon ? "hamarosan esedékes" : u === 1 ? "esedékes hamarosan (narancs)" : t.section_name === "Elakadt" ? "elakadt" : "folyamatban";
      items.push({t, P, p, why});
    }
    if (items.length) groups.push({P, items: items.sort((a, b) => a.p - b.p || (a.t.due_on || "9").localeCompare(b.t.due_on || "9"))});
  }
  return groups.sort((a, b) => (PRIO_W[a.P.portfolio.priority] ?? 3) - (PRIO_W[b.P.portfolio.priority] ?? 3) || a.P.portfolio.name.localeCompare(b.P.portfolio.name, "hu"));
}

function dayInput(where, parent) {
  const key = where + "|" + (parent || "");
  return `<div class="dinw"><input class="din" data-din="${esc(where)}" data-dparent="${esc(parent || "")}" value="${esc(state.dayDraft?.[key] || "")}" maxlength="300" autocomplete="off"
    placeholder="${where === "goals" ? "+ mai cél (Enter)" : parent ? "+ alfeladat (Enter, Esc: mégse)" : "+ feladat (Enter)"}" aria-label="${where === "goals" ? "Új mai cél" : "Új feladat"}">
    ${state.dayDupQ?.key === key ? `<div class="ddup">Hasonló, már meglévő feladat: <b>${esc(state.dayDupQ.t.name)}</b> <span class="hint">${esc(state.dayDupQ.P.portfolio.name)}</span>
      <button class="btn" data-dact="dup-link">Ez az, kösd hozzá</button><button class="btn" data-dact="dup-new">Nem, új feladat</button></div>` : ""}</div>`;
}
function dayItemHtml(it) {

      ${state.dayEdit === it.id ? `<input class="din dedit" data-dedit="${esc(it.id)}" value="${esc(t ? t.name : it.text)}" maxlength="300" aria-label="Szöveg">` : `<span class="dtx" data-dtext title="Dupla kattintás: átírás">${esc(t ? t.name : it.text)}</span>`}
      ${tk ? `<button class="dpj" data-dopen="${esc(it.gid)}" title="Asana-feladat · ${esc(tk.P.portfolio.name)} · ${esc(t.section_name || "")} — megnyitás">${esc(tk.P.portfolio.name)}</button>${t.due_on ? `<span class="due ${late ? "late" : ""}">${fmtD(t.due_on)}</span>` : ""}`
        : it.creating ? '<span class="hint">létrehozás az Asanában…</span>' : it.gid ? '<span class="hint" title="Az Asana-lista még nem hozta be">Asana</span>' : '<span class="dloc" title="Csak a napi tervben él, nem került Asanába">napi</span>'}

      ${(() => { if (it.gid || it.creating) return ""; const dp = dayDup(it.text); if (!dp || dp.t.gid === it.notDup || dayHasGid(dp.t.gid)) return "";
        return `<button class="dmrg" data-dact="merge" title="Hasonló, már létező Asana-feladat: „${esc(dp.t.name)}” (${esc(dp.P.portfolio.name)}). Kattintás: összevonás — ehhez kötöm, nem lesz duplikátum."><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2.5c0 3 4 3 4 6M10 2.5c0 3-4 3-4 6M6 8.5v2"/></svg>összevonható</button>`; })()}
      <span class="da">${!it.gid && !it.creating && it._sec !== "goals" && DB.ready && DB.canEdit ? `<button class="dpro" data-dact="promote" title="Asanába és a projekt-nyilvántartásba (${esc(dayTargetP()?.portfolio.name || "válassz projektet")})" aria-label="Asanába küldés"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8V1.8M3.5 4.2 6 1.8l2.5 2.4M2 7.5v2.7h8V7.5"/></svg></button>` : ""}<button data-dact="addkid" title="Alfeladat" aria-label="Alfeladat"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M5 1.5v7M1.5 5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><button data-dact="remove" title="Kivétel a mai tervből (az Asanában megmarad)" aria-label="Kivétel"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 3.5h7M5 3.5V2h2v1.5M3.5 3.5l.5 6.5h4l.5-6.5"/></svg></button></span></div>
    ${(it.kids || []).length || state.dayKid === it.id ? `<ul class="dl">${(it.kids || []).map(dayItemHtml).join("")}${state.dayKid === it.id ? `<li class="di">${dayInput(it._sec || "", it.id)}</li>` : ""}</ul>` : ""}</li>`;

function tabDay() {
  const d = dayDoc(), canEdit = DB.ready && DB.canEdit, live = AS.mode === "live";

  const cands = dayCands();
  const sec = (k, l, list) => d.off.includes(k) ? "" : `<details class="dsec" data-dsec="${k}" ${DAYC.has(k) ? "" : "open"}><summary>${esc(l)} <span class="hint">${list.length ? list.length : ""}</span>${canEdit && DAY_OPT[k] ? `<button class="dsoff" data-dsecoff="${k}" title="Ma nincs ${esc(l.toLowerCase())} — eltávolítás a mai tervből" aria-label="${esc(l)} eltávolítása"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 3.5h7M5 3.5V2h2v1.5M3.5 3.5l.5 6.5h4l.5-6.5"/></svg></button>` : ""}</summary>
    <div class="dzone" data-dzone="${k}"><ul class="dl">${list.map(dayItemHtml).join("")}</ul>${canEdit ? dayInput(k, null) : ""}</div></details>`;
  const nOpen = (() => { let n = 0; for (const l of dayLists(d)) dayWalk(l, it => { const tk = it.gid && dayTask(it.gid); if (!(tk ? tk.t.completed : it.done)) n++; }); return n; })();
  return `<div class="dayg">
    <div class="panel dayl">
      <div class="sec-h"><h3>Mai nap</h3><span class="hint">${esc(fmtCr(TODAY))} · ${nOpen} nyitott tétel</span>${canEdit && left.length ? `<button class="btn" data-dact="carry" style="margin-left:auto" title="A legutóbbi napi terv befejezetlen tételei ugyanabba a napszakba kerülnek">Áthozom a ${esc(fmtCr(prev))}-i befejezetleneket (${left.length})</button>` : ""}</div>
      <div class="vdesc" style="margin:-4px 0 8px">A mai napod terve: céges és magán tételek napszakokra bontva. Este automatikusan a Napi naplóba kerül.</div>
      ${canEdit ? `<div class="dproj hint">Az új tételek csak napi tételek. Asanába küldés (⇧ ikon a sor végén) ide: ${pSel} <span>— a lila „összevonható” jelzés egy már létező, hasonló feladatra mutat.</span></div>` : ""}
      <div class="dgoals dzone" data-dzone="goals"><div class="dgh">Mai célok <span class="hint">${d.goals.length > 3 ? "a fókuszhoz 2–3 cél ideális" : "a nap néhány fő prioritása"}</span></div>
        <ul class="dl">${d.goals.map(dayItemHtml).join("")}</ul>${canEdit ? dayInput("goals", null) : ""}</div>

      ${canEdit && d.off.length ? `<div class="dsrest">Ma kihagyva: ${DAY_SECS.filter(([k]) => d.off.includes(k)).map(([k, l]) => `<button data-dsecon="${k}" title="Visszaállítás a mai tervbe">+ ${esc(l)}</button>`).join("")}</div>` : ""}
      ${canEdit ? "" : '<div class="notice">Ebben a nézetben a napi terv csak olvasható.</div>'}
    </div>
    <div class="panel dayr">

        <ul class="dcl">${dayTop(g).map(x => { const inPlan = dayHasGid(x.t.gid); return `<li class="dc${inPlan ? " in" : ""}" draggable="${inPlan ? "false" : "true"}" data-dgid="${esc(x.t.gid)}">
          <i class="pp p${x.p}" title="${x.p === 1 ? "1 – most" : x.p === 2 ? "2 – hamarosan" : "3 – folyamatban"}"></i><span class="dcx"><span class="dtx">${esc(x.t.name)}</span>

    </div></div>`;
}

/* műveletek */
function dayInsert(where, parent, item) {
  const d = dayDoc();
  if (parent) { const h = dayFind(parent); if (h) { (h.it.kids ||= []).push(item); return; } }
  if (d.off.includes(where)) where = DAY_OPT[where];
  (where === "goals" ? d.goals : d.secs[where] || d.secs.delelott).push(item);
}
async function dayAddText(where, parent, text, forceNew, linkTo) {
  const key = where + "|" + (parent || ""), item = {id: dayNid(), text, done: false, kids: []};
  if (state.dayDraft) delete state.dayDraft[key];
  state.dayLast = where === "goals" ? state.dayLast : where;
  const pid = state.dayProj ?? state.pid;
  if (linkTo) { if (dayHasGid(linkTo.gid)) { toast("Ez a feladat már szerepel a mai tervben."); render(); return; } Object.assign(item, {gid: linkTo.gid, pid: linkTo.pid}); dayInsert(where, parent, item); render(); daySave(); return; }
  dayInsert(where, parent, item); render(); daySave();   // alapból csak napi tétel; Asanába a ⇧ ikonnal (dayPromote)
}
const dayTargetP = () => { const ok = D.pages.filter(p => p.page.asana?.projects?.length); return ok.find(p => p.id === (state.dayProj || state.pid)) || ok[0] || null; };
async function dayPromote(id) {
  const h0 = dayFind(id); if (!h0 || h0.it.gid || h0.it.creating) return;
  if (!(DB.ready && DB.canEdit)) { toast("Ebben a nézetben nem küldhető Asanába."); return; }
  if (AS.mode !== "live") { toast("Élő Asana-kapcsolat nélkül nem küldhető Asanába."); return; }
  const P = dayTargetP(); if (!P) { toast("Nincs Asanához kötött projekt."); return; }
  const item = h0.it, text = item.text, pid = P.id, gid = P.page.asana.projects[0].gid;
  item.creating = true; item.pid = pid; render(); daySave();
  const sec = (AS.sections[gid] || []).find(s => s.name === "Következik") || (AS.sections[gid] || []).find(s => s.name === "Backlog");
  try {
    const task = {name: text, project_id: gid, assignee: "me"}; if (sec) task.section_id = sec.gid;
    const r = await AS.mcp.callTool("Asana", "create_tasks", {default_project: gid, tasks: [task]});
    if ((r.payload?.failed || []).length) throw {message: r.payload.failed[0]?.error || "Az Asana nem hozta létre."};
    const s = r.payload?.succeeded?.[0] || r.payload?.data?.[0] || {}, ng = s.gid || s.task?.gid || s.data?.gid;
    const h = dayFind(item.id); if (h) { delete h.it.creating; if (ng) h.it.gid = ng; }
    if (ng) { const ot = {gid: ng, name: text, notes: "", completed: !!item.done, due_on: null, start_on: null, section_gid: sec?.gid || null, tags: [], assignee: null, assignee_gid: null, dependencies: [], created_at: TODAY, munkaszal: "", t0: Date.now()};
      (AS.opt[gid] ||= []).push(ot); const st = AS.byProject[gid]; if (st && !st.tasks.some(x => x.gid === ng)) st.tasks.push(ot); UPD.gids.add(ng); }
    AS.mcp.invalidate("Asana", "get_tasks").catch(() => {});
    const at = new Date().toISOString();
    DB.db.collection("data/log/events").add({project: pid, type: "note", text: `Új Asana-feladat (Ma nézetből${sec ? ", " + sec.name : ""}): ${text}`, by: DB.me, at}).catch(() => {});
    DB.db.collection("data/changes/events").add({project: pid, target: "repo_note", value: `Új feladat (Ma nézetből, Asana${ng ? " " + ng : ""}): ${text}`, by: DB.me, at}).catch(() => {});   // a repó-szinkron vezeti át a projekt md-fájljába
    toast(`Asanába és a projekt-nyilvántartásba küldve (${P.portfolio.name}): „${text}”`);
  } catch (err) { const h = dayFind(item.id); if (h) { delete h.it.creating; delete h.it.pid; } toast(`Az Asanában nem jött létre, napi tételként megmaradt: ${err?.message || err?.code || "hiba"}`); }
  render(); daySave();
}
async function dayToggle(id, on) {
  const h = dayFind(id); if (!h) return;
  const tk = h.it.gid && dayTask(h.it.gid);
  if (tk) { UPD.gids.add(tk.t.gid); await moveTask(tk.t, on ? "Kész" : "Folyamatban"); }
  else { h.it.done = on; render(); daySave(); }
}
function dayPlace(item, ref, pos) { const r = dayFind(ref); if (!r) return false; r.list.splice(r.i + (pos === "after" ? 1 : 0), 0, item); return true; }
function dayMove(id, where, parent, ref, pos) {   // bal oldali tétel áthelyezése (másik napszak / tétel alá / egy tétel elé-mögé)
  const h = dayFind(id), tgt = ref || parent; if (!h || id === tgt) return;
  if (tgt) { let bad = false; dayWalk(h.it.kids || [], x => { if (x.id === tgt) { bad = true; return false; } }); if (bad) return; }
  h.list.splice(h.i, 1);
  if (!(ref && dayPlace(h.it, ref, pos))) dayInsert(where, parent, h.it);
  render(); daySave();
}
function dayAddGid(gid, where, parent, ref, pos) {
  if (dayHasGid(gid)) { toast("Ez a feladat már szerepel a mai tervben."); return; }
  const tk = dayTask(gid); if (!tk) return;
  const it = {id: dayNid(), text: tk.t.name, gid, pid: tk.P.id, done: false, kids: []};
  if (!(ref && dayPlace(it, ref, pos))) dayInsert(where, parent, it); state.dayLast = where === "goals" ? state.dayLast : where; render(); daySave();
}

const daySecSet = (s, open) => { open ? DAYC.delete(s) : DAYC.add(s); try { localStorage.setItem("day-closed", JSON.stringify([...DAYC])); } catch {} };

    if (off) { const moved = d.secs[k].length, to = DAY_OPT[k]; if (moved) { d.secs[to].unshift(...d.secs[k]); d.secs[k] = []; } if (!d.off.includes(k)) d.off.push(k); if (state.dayLast === k) state.dayLast = to;
      toast(`Ma nincs ${lbl.toLowerCase()}${moved ? ` — ${moved} tétel átkerült ide: ${DAY_SECS.find(s => s[0] === to)[1]}` : ""}. Lent visszaállítható.`); }

document.addEventListener("toggle", e => { const s = e.target.dataset?.dsec || (e.target.dataset?.dcg && "p:" + e.target.dataset.dcg); if (s) daySecSet(s, e.target.open); if (e.target.dataset?.dcg) { const b = document.querySelector(".dall [data-dact=dcg-all]"), any = [...document.querySelectorAll("details.dcg")].some(d => d.open); if (b) { b.dataset.open = any ? "0" : "1"; b.textContent = any ? "Mind bezár" : "Mind kinyit"; b.title = any ? "Minden projekt bezárása" : "Minden projekt kinyitása (projektenként a 3 legsürgősebb látszik)"; } } }, true);

  if (e.key === "Enter") { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; e.target.value = ""; dayAddText(where, parent, v); }
}, true);

document.addEventListener("click", e => {
  const op = e.target.closest?.("[data-dopen]") || (!e.target.closest?.("[data-dact], a, button, input") && e.target.closest?.(".dayr .dc[data-dgid]")); if (op) { const tk = dayTask(op.dataset.dopen || op.dataset.dgid); if (tk) { if (state.pid !== tk.P.id) { state.pid = tk.P.id; render(); } openEditor(tk.t.gid); } return; }

    Object.assign(h.it, {gid: dp.t.gid, pid: dp.P.id, auto: true}); render(); daySave(); toast(`Összevonva: „${dp.t.name}” (${dp.P.portfolio.name}).`); }

const dayDropAt = e => { const r = e.target.closest?.(".dayl .di > .dr"); if (r) { const id = r.closest("[data-did]").dataset.did, b = r.getBoundingClientRect(), f = (e.clientY - b.top) / (b.height || 1), pos = f < .3 ? "before" : f > .7 ? "after" : "child";
    return pos === "child" ? {el: r, where: null, parent: id, pos} : {el: r, where: null, parent: dayFind(id)?.parent?.id || null, ref: id, pos}; } const z = e.target.closest?.("[data-dzone]"); if (z) return {el: z, where: z.dataset.dzone, parent: null}; const s = e.target.closest?.("details.dsec"); return s ? {el: s, where: s.dataset.dsec, parent: null} : null; };

/* ---------------- Meeting-jegyzetek ----------------
   Repó: projects/<P>/meetings.yaml (id, date, title, people?, text). Felületen: data/log/events, type "meeting", op add|edit|delete; a Projektlap-frissítés vezeti át.
   Al-fülek: Jegyzet (szöveg, alapértelmezett) és Mind Map — ez a Tiszta lap motorja, a meetinghez kötve (az elemei a meeting térképén élnek; az ötletek ugyanúgy Asana-feladatok). */
function meetOf(P) {
  const list = (P.meetings || []).map(m => ({...m}));
  for (const e of DB.log.filter(e => e.project === P.id && e.type === "meeting").sort((a, b) => (a.at || "").localeCompare(b.at || ""))) {
    const i = list.findIndex(m => m.id === e.mid);
    if (e.op === "add" && i < 0) list.push({id: e.mid, date: e.date || (e.at || "").slice(0, 10), title: e.title || "", people: e.people || "", text: e.text || "", pending: true});
    else if (e.op === "edit" && i >= 0) list[i] = {...list[i], ...Object.fromEntries(["date", "title", "people", "text"].filter(k => k in e).map(k => [k, e[k]])), pending: true};
    else if (e.op === "delete" && i >= 0) list.splice(i, 1);
  }
  for (const m of list) { const d = state.meetDraft?.[m.id]; if (d) Object.assign(m, d); }   // még el nem küldött gépelés
  return list.sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.id || "").localeCompare(a.id || ""));
}
async function meetOp(op, mid, extra) {
  if (!(DB.ready && DB.canEdit)) { toast("Ehhez szerkesztői jog kell."); return false; }
  try { await DB.db.collection("data/log/events").add({project: state.pid, type: "meeting", op, mid, ...extra, by: DB.me, at: new Date().toISOString()}); return true; }
  catch (err) { toast(`Nem sikerült menteni (${err?.code || "hiba"}).`); return false; }
}
const MEETT = {};
function meetQueue(mid) {   // gépelés közben 1,5 mp szünet után ment (a teljes állapotot)
  clearTimeout(MEETT[mid]); MEETT[mid] = setTimeout(() => meetFlush(mid), 1500);
}
async function meetFlush(mid) {
  clearTimeout(MEETT[mid]); const d = state.meetDraft?.[mid]; if (!d) return;
  if (await meetOp("edit", mid, {...d})) { delete state.meetDraft[mid]; const el = document.getElementById("meet-state"); if (el) el.textContent = "Mentve"; }
}
function tabMeet(P) {
  const ms = meetOf(P), canEdit = DB.ready && DB.canEdit;
  if (state.meetSel && !ms.some(m => m.id === state.meetSel)) state.meetSel = null;
  if (!state.meetSel && ms.length) state.meetSel = ms[0].id;
  const m = ms.find(x => x.id === state.meetSel), view = state.meetView || "text";
  const list = `<div class="panel meetl"><div class="sec-h"><h3>Meetingek</h3>${canEdit ? `<button class="btn" data-meet="new" style="margin-left:auto">+ Új meeting</button>` : ""}</div>
    <ul>${ms.map(x => `<li class="${x.id === state.meetSel ? "on" : ""}" data-mid="${esc(x.id)}" tabindex="0"><time>${esc(fmtCr(x.date || TODAY))}</time><span>${esc(x.title || "Meeting")}</span>
      ${canEdit ? `<button class="mdel" data-meet="del" title="Meeting törlése" aria-label="Törlés"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 3.5h7M5 3.5V2h2v1.5M3.5 3.5l.5 6.5h4l.5-6.5"/></svg></button>` : ""}</li>`).join("") || '<li class="empty">Még nincs meeting-jegyzet.</li>'}</ul></div>`;

async function reflAi(P) {

  state.rfBusy = true; render();
  const tasks = tasksOf(P), open = tasks.filter(t => !t.completed);
  const ctx = {project: P.portfolio.name, today: TODAY, goal: P.page.intro?.summary || P.page.intro?.text || "", next_step: curGate(P),
    health: (P.page.health?.dimensions || []).map(d => ({[d.key]: d.rating, note: d.note})), risks: (P.page.risks || []).filter(r => r.status !== "closed").map(r => r.title),
    open_tasks: open.length, late_tasks: open.filter(isLate).map(t => t.name).slice(0, 10), in_progress: open.filter(t => t.section_name === "Folyamatban").map(t => t.name).slice(0, 10),
    recent_history: allEvents(P).slice(-12).map(e => ({date: e.date, type: e.type, text: e.text})), earlier_reflections: reflOf(P).slice(0, 10).map(r => ({date: r.date, origin: r.origin, text: r.text}))};
  const prompt = `Egy projektgazda reflexiós naplójába írsz saját, rövid megfigyeléseket a projektről. Magyarul.
Adj 1–3 reflexiót: mintázat, ellentmondás, kockázat, kérdés vagy tanulság, amit az adatokból látsz és érdemes végiggondolni. Ne ismételd a korábbi reflexiókat, ne fogalmazz tanácsadó-zsargonnal, és ne találj ki tényt, dátumot, nevet, számot: csak az adatokból dolgozz. Egy reflexió legfeljebb 2–3 mondat.
Csak JSON-t adj vissza: {"reflections": ["…", "…"]}

ADATOK:
${JSON.stringify(ctx)}`;
  try {
    const res = await sample.json(prompt, {modelTier: "default", cache: false});
    const rs = (Array.isArray(res?.reflections) ? res.reflections : []).filter(x => typeof x === "string" && x.trim()).slice(0, 3);
    for (const text of rs) await reflOp("add", reflId(), {text: text.trim(), origin: "claude"});
    toast(rs.length ? `Claude ${rs.length} reflexiót rögzített.` : "Claude most nem talált új, érdemi megfigyelést.");
  } catch (err) { toast(err?.code === "not_granted" ? "Az AI-hozzáférést nem engedélyezted ennél az oldalnál." : `Nem sikerült: ${err?.message || err?.code || "hiba"}`); }
  finally { state.rfBusy = false; render(); }
}

/* Személy-nézet: projektjei (gazda, közreműködő, szerep, döntéshozó, kulcsember) és feladatai.
   Feladat akkor az övé, ha a leírás első sora „Felelős: <név>” (D011), vagy az Asanában ő a felelős. Csak a projektlappal bíró projektek Asana-feladatai látszanak. */
function personTasks(id) {
  const out = [];
  for (const P of D.pages) for (const t of tasksOf(P)) {
    const o = ownerAny(t), oid = o ? personId(o) : null, aid = t.assignee ? personId(typeof t.assignee === "string" ? t.assignee : t.assignee.name) : null;
    if (oid === id || (!oid && !ownerNone(t) && aid === id)) out.push({P, t});
  }
  return out;
}
/* ---------------- Fókusz-blokk a személy-nézet tetején ----------------
   Cél: 30 mp alatt látni, mi dolgod van most a kollégával. Rendezőelv: kinél a labda (tőle várok / ő vár rám / közös kockázat), egy rangsorolt lista, max. 7 tétel.
   Források: a feladatai (Felelős-sor), az Áronnál lévő, őt említő feladatok, a döntések, ahol ő a döntéshozó, és az őt említő kockázatok/korlátok.
   A labda irányát a rendszer tippeli, Áron egy kattintással felülírja; a „megbeszélve” jelölés kimenete a projekt történetébe és (feladatnál) Asana-kommentbe megy.
   Tár: data/plan/focus/<személy>~<tétel-kulcs> {ball, done, outcome, sig, at} – nem forrásadat, a szinkron nem vezeti át. */
const FOC = {docs: {}}, FOC_TOP = 7;
const BALL = {nala: ["Tőle várok", "tole"], nalam: ["Ő vár rám", "nalam"], kozos: ["Közös kockázat", "kozos"]};
const FREEZE = (() => { const c = (D.calendar || []).find(x => x.id === "freeze"); if (c) return c.date; for (const P of D.pages) for (const e of P.page.dependencies?.events || []) if (/freeze/i.test(e.name) && e.date) return e.date; return null; })();
const dDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 86400000);
function personNames(id) { const p = D.people?.people?.[id] || {}; return [...new Set([p.display_name, p.short_name, ...(p.aliases || [])].filter(x => x && x.length >= 3))]; }
function mentions(text, names) { const t = String(text || "").toLowerCase(); return names.some(n => new RegExp("(^|[^\\p{L}])" + n.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "u").test(t)); }
function guessBall(txt) {
  const t = String(txt || "").toLowerCase();
  if (/(döntés|jóváhagy|felvi(sz|nni)|eszkal|áron (dönt|válasz)|tőlem|nekem kell)/.test(t)) return "nalam";
  return "nala";
}
function focusItems(id) {
  const names = personNames(id), out = [], prio = p => ({high: 3, medium: 2, low: 1}[p] || 1), soon = n2d(d2n(TODAY) + 7);
  const taskItem = (P, t, own) => {
    const late = isLate(t), stuck = t.section_name === "Elakadt", dueSoon = t.due_on && t.due_on <= soon;
    if (!own && !(late || stuck || dueSoon || t.section_name === "Folyamatban")) return;
    if (own && !(late || stuck || dueSoon)) return;
    const why = stuck ? "elakadt" : "";
    const ball = stuck ? "kozos" : own ? "nala" : guessBall((t.name || "") + " " + (t.notes || ""));
    const score = prio(P.portfolio.priority) * 10 + (late ? 20 + Math.min(dDiff(TODAY, t.due_on), 20) : dueSoon ? 12 - Math.max(0, dDiff(t.due_on, TODAY)) : 0) + (stuck ? 15 : 0) + (urgOf(P, t) === 2 ? 10 : 0);
    out.push({key: "t:" + t.gid, ball, P, title: t.name, why, due: t.due_on || null, score, gid: t.gid, sig: [t.due_on, t.section_name, late].join("|"), src: ""});
  };
  for (const {P, t} of personTasks(id)) if (!t.completed) taskItem(P, t, true);
  const own = new Set(out.map(x => x.key));
  for (const P of D.pages) for (const t of tasksOf(P)) if (!t.completed && !own.has("t:" + t.gid) && mentions((t.name || "") + "\n" + (t.notes || ""), names)) taskItem(P, t, false);
  for (const p of D.cockpit?.portfolio?.projects || []) for (const [i, d] of (p.decisions || []).entries()) if (d.status !== "decided" && (d.decision_maker_ids || []).includes(id)) {
    const P = D.pages.find(x => x.id === p.id), nb = d.needed_by?.value;
    out.push({key: `d:${p.id}:${i}`, ball: "nala", P, pname: p.name, title: "Döntése kell: " + d.question, why: nb && !/^\d{4}-\d{2}-\d{2}$/.test(nb) ? `kell: ${nb}` : "", due: /^\d{4}-\d{2}-\d{2}$/.test(nb || "") ? nb : null, score: prio(p.priority) * 10 + 14, sig: nb || "", src: "nyitott döntés"});
  }
  for (const P of D.pages) {
    for (const r of P.page.risks || []) if (r.status !== "closed" && r.severity === "high" && mentions(r.title + " " + (r.mitigation || ""), names))
      out.push({key: `r:${P.id}:${r.id}`, ball: "kozos", P, title: r.title, why: "magas kockázat" + (r.mitigation ? " · " + r.mitigation : ""), score: prio(P.portfolio.priority) * 10 + 16, sig: r.status, src: "kockázat"});
    for (const c of P.page.dependencies?.constraints || []) if (c.dot === "red" && mentions(c.text, names))
      out.push({key: `c:${P.id}:${c.id}`, ball: "kozos", P, title: c.text, why: "kritikus erőforrás-korlát", score: prio(P.portfolio.priority) * 10 + 18, sig: c.text, src: "korlát"});
  }
  const seen = new Set(), res = [];
  for (const x of out.sort((a, b) => b.score - a.score)) {

function personView(id) {
  const pp = D.people?.people?.[id];
  if (!pp) return '<div class="panel" style="padding:20px;margin-top:16px"><div class="empty">Válassz személyt a fejlécben.</div></div>';
  const rel = new Map(), add = (pid, name, role, page) => { const r = rel.get(pid) || {pid, name, roles: [], page}; if (!r.roles.includes(role)) r.roles.push(role); rel.set(pid, r); };
  const pages = new Set(D.pages.map(P => P.id)), decs = [];
  for (const p of D.cockpit?.portfolio?.projects || []) {
    if (p.owner_id === id) add(p.id, p.name, "gazda", pages.has(p.id));
    if ((p.contributor_ids || []).includes(id)) add(p.id, p.name, "közreműködő", pages.has(p.id));
    for (const [k, v] of Object.entries(p.role_assignments || {})) if (v === id) add(p.id, p.name, k.replace(/_id$/, "").replace(/_/g, " "), pages.has(p.id));
    for (const d of p.decisions || []) if (d.status !== "decided" && (d.decision_maker_ids || []).includes(id)) { add(p.id, p.name, "döntéshozó", pages.has(p.id)); decs.push({p, d}); }
  }
  for (const P of D.pages) {
    for (const r of P.page.roles || []) if (r.person_id === id) add(P.id, P.portfolio.name, r.role, true);
    for (const x of P.page.dependencies?.people || []) if (x.id === id) add(P.id, P.portfolio.name, "kulcsember" + (x.note ? ": " + x.note : ""), true);
  }
  for (const e of DB.log.filter(e => e.type === "dep" && e.list === "people" && e.key === id && e.op === "check")) { const P = D.pages.find(x => x.id === e.project); if (P) { if (e.on) add(P.id, P.portfolio.name, "kulcsember (felületen jelölve)", true); } }
  const projs = [...rel.values()];
  const tasks = personTasks(id), open = tasks.filter(x => !x.t.completed), late = open.filter(x => isLate(x.t));
  const byP = {}; for (const x of tasks) (byP[x.P.id] ??= []).push(x);
  const tRow = ({P, t}) => `<li class="pv-t${t.completed ? " done" : ""}" data-ostask="${esc(P.id)}|${esc(t.gid)}" title="Megnyitás a projektlapon"><span class="nm">${esc(t.name || "(névtelen)")}</span><span class="sec">${esc(t.section_name || "")}</span><span class="due${isLate(t) ? " late" : ""}">${t.due_on ? esc(fmtD(t.due_on)) : "—"}</span></li>`;
  return `<div class="pv-h"><div><div class="eyebrow">Személy</div><h1>${esc(pp.display_name)}</h1><div class="hint">${esc(pp.role && pp.role !== "nincs rögzítve" ? pp.role : "szerep nincs rögzítve")}</div><div class="vdesc">Fent: mi dolgod van vele most (kinél a labda, rangsorolva). Alatta: összes nyitott feladata (az Asana „Felelős:” sora alapján), választható rendezéssel; legalul a projektjei.</div></div>
      <div class="stat"><span><b>${projs.length}</b>projekt</span><span><b>${open.length}</b>nyitott feladat</span><span class="${late.length ? "bad" : "ok"}"><b>${late.length}</b>lejárt</span><span><b>${decs.length}</b>nyitott döntés</span></div></div>
    ${focusBlock(id)}
    ${pvTaskBlock(id)}
    <div class="pv-grid" style="margin-top:16px;grid-template-columns:1fr">
      <div class="panel"><div class="sec-h" style="padding:12px 14px 6px"><h3>Projektjei</h3><span class="hint">gazda, közreműködő, szerep, döntéshozó, kulcsember</span></div>
        <div class="pv-tiles">${projs.map(r => { const pf = (D.cockpit?.portfolio?.projects || []).find(x => x.id === r.pid) || {}, mine = open.filter(x => x.P.id === r.pid), lt = mine.filter(x => isLate(x.t)).length;
          return `<button class="pv-tile" ${r.page ? `data-osproj="${esc(r.pid)}"` : `data-osov="${esc(r.pid)}"`}><span class="tn">${esc(r.name)}</span>
            <span class="tr" title="${esc(r.roles.join(" · "))}">${esc(r.roles.join(" · "))}</span>
            <span class="tm">${pf.priority ? `<span class="prio ${esc(pf.priority)}">${esc(L.prio?.[pf.priority] || pf.priority)}</span>` : ""}${mine.length ? `<span>${mine.length} feladata</span>` : ""}${lt ? `<span class="late">${lt} lejárt</span>` : ""}${r.page ? "" : '<span>projektlap nélkül</span>'}</span></button>`; }).join("") || '<div class="empty" style="padding:4px 2px">Nincs hozzá rendelt projekt.</div>'}</div>
        ${decs.length ? `<div class="sec-h" style="padding:12px 14px 6px"><h3>Döntésre vár nála</h3></div><ul class="pv-l">${decs.map(({p, d}) => `<li ${pages.has(p.id) ? `data-osproj="${esc(p.id)}"` : `data-osov="${esc(p.id)}"`}>${esc(d.question)}<div class="r">${esc(p.name)}</div></li>`).join("")}</ul>` : ""}</div>
    </div>`;
}

/* LB / Personal: két külön artifact (D014). A választó a másik lapra mutató link, nem szűrő: személyes adat nem kerül az LB-lapba, és fordítva. */
const SPACE = D.space || "lb", SPACES = [["lb", "LB"], ["personal", "Personal"]];   // "day" = közös Mai nap artifact: mindkettő link
function spaceNav() {
  const el = document.getElementById("spc"); if (!el || el.dataset.ok) return; el.dataset.ok = 1;
  const links = D.space_cfg?.links || {};
  el.innerHTML = SPACES.map(([k, l]) => k === SPACE ? `<span class="on" aria-current="page">${l}</span>`
    : links[k] ? `<a href="${esc(links[k])}" target="_top" title="${l} Project OS megnyitása">${l}</a>`
    : `<span class="off" title="A ${l} projektlap még nem készült el">${l}</span>`).join("");
}
function dayFocusRestore() {   // Mai nap: újrarajzolás után a fókusz a beviteli mezőn marad
  if (!state.dayFocus) return;
  const el = state.dayFocus === "edit" ? document.querySelector("[data-dedit]") : [...document.querySelectorAll("[data-din]")].find(x => x.dataset.din + "|" + x.dataset.dparent === state.dayFocus);
  if (el && document.activeElement !== el) { el.focus(); el.setSelectionRange?.(el.value.length, el.value.length); }
}
function render() {
  const P = page();
  if (state.tab === "meet" && !state.meetSel) { const ms = meetOf(P); if (ms.length) state.meetSel = ms[0].id; }
  mmMeetMode();
  saveView();
  state.tier = "full";   // a szűk/teljes lap váltó megszűnt (Áron, okt. 21.): mindig a teljes lap
  osNav(); spaceNav();
  document.querySelectorAll("#tiersel button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tier === state.tier)));
  const conn = document.getElementById("conn");
  conn.className = "conn " + ({live:"live", init:"wait", error:"err"}[AS.mode] || "");
  conn.querySelector("span").textContent = {live:"Asana: élő", init:"Asana: kapcsolódás…", error:"Asana: pillanatkép"}[AS.mode] || "Asana";
  if (state.mode !== "project") {   // Project OS: áttekintés vagy személy-nézet (D015)
    document.getElementById("main").innerHTML = state.mode === "day" ? `<section class="work dayw">${tabDay(P)}</section>` : state.mode === "person" ? personView(state.person)
      : `<div id="ov"><div class="toolbar"><div class="seg ovtabs" id="ov-tabs" role="group" aria-label="Áttekintés nézetei"></div></div><div id="ov-main"></div><div id="ov-drawer"></div></div>`;
    if (state.mode === "overview") OV.render();
    if (state.mode === "day") dayFocusRestore();
    freshUi(); return;
  }
  const full = state.tier === "full";
  const tabs = full ? TABS : [["tasks","Feladatok"]];
  if (!tabs.some(t => t[0] === state.tab)) state.tab = "tasks";
  const counts = {tasks: tasksOf(P).filter(t => !t.completed).length, health:(P.page.risks||[]).filter(r => r.status !== "closed").length};
  counts.refl = reflOf(P).length || null; counts.docs = docsOf(P).length || null;
  const body = {docs:tabDocs, meet:tabMeet, tasks:tabTasks, progress:tabProgress, health:tabHealth, deps:tabDeps, refl:tabRefl, eval:tabEval}[state.tab](P);
  document.getElementById("main").innerHTML = backLink() + header(P) + (full ? introFold(P) : "") + summary(P) +
    `<section class="work"><div class="tabbar" role="tablist">${tabs.map(([k,l]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}${counts[k] != null ? `<span class="n">${counts[k]}</span>` : ""}</button>`).join("")}</div><div role="tabpanel">${TAB_DESC[state.tab] ? `<div class="vdesc tabdesc">${TAB_DESC[state.tab]}</div>` : ""}${body}</div></section>` +
    bottomFolds(P) + `<p class="hint foot">${esc(L.stage[P.portfolio.stage] || P.portfolio.stage)} · forrás: ${esc(P.source.repo === "local" ? (D.repo_name || "lb-product-cockpit") : P.source.repo.split("/")[1])}/${esc(P.source.path)}${P.source.commit ? "@" + esc(P.source.commit) : ""} · portfólió-adat: ${esc(D.portfolio_snapshot)} · build ${esc(D.built_from || "")} · ${full ? "teljes" : "szűk"} lap</p>`;
  wireHill(); freshUi();
  if (mmActive()) mmMount();
  if (state.tab === "meet" && state.meetFocus && !mmActive()) { const el = document.querySelector(`[data-mf="${state.meetFocus}"]`); if (el && document.activeElement !== el) { el.focus(); if (state.meetFocus === "text" && state.meetCaret) el.setSelectionRange(...state.meetCaret); } }
  { const hr = document.querySelector("[data-hillren]"); if (hr && document.activeElement !== hr) { hr.focus(); if (state.hillRen && state.hillRen.value == null) hr.select(); } }
  { const ha = document.querySelector("[data-hilladd]"); if (ha && document.activeElement !== ha) { ha.focus(); ha.setSelectionRange(ha.value.length, ha.value.length); } }   // újrarajzolás után a félig beírt név megmarad
  if (state.tab === "tasks" && state.taskView === "timeline") tlMount();
  if (state.tab === "docs" && state.docFocus) { const el = document.querySelector(`[data-df="${state.docFocus}"]`); if (el && document.activeElement !== el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch {} } }
  if (state.tab === "refl" && state.rfFocus) { const el = state.rfFocus === "new" ? document.getElementById("rf-new") : document.querySelector("[data-rfedit]"); if (el && document.activeElement !== el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }   // újrarajzoláskor a félig írt szöveg és a fókusz megmarad
}

let popEl = null;
const closePop = () => { popEl?.remove(); popEl = null; };
function toast(msg) { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4200); }
document.addEventListener("click", e => {
  const ib = e.target.closest(".info[data-info]:not(#ov .info)");

  if (act === "hill-cancel") { state.hillMove = null; render(); }

/* hill: név fix helyen a pötty fölött (nem követi az egeret, nem takarja a kört) */
function showHillTip(g) {
  const host = g.closest(".hill"); if (!host || state.hillMove) return;
  host.querySelector(".htip")?.remove();
  const c = g.querySelector("circle").getBoundingClientRect(), h = host.getBoundingClientRect();
  const tip = document.createElement("div"); tip.className = "htip";
  tip.textContent = g.dataset.label;
  host.appendChild(tip);
  const above = c.top - h.top > tip.offsetHeight + 10;
  tip.classList.toggle("below", !above);
  let left = c.left - h.left + c.width / 2;
  const half = tip.offsetWidth / 2; left = Math.max(half, Math.min(h.width - half, left));
  tip.style.left = left + "px";
  tip.style.top = (above ? c.top - h.top - 6 : c.bottom - h.top + 6) + "px";
}
const hideHillTip = g => g.closest(".hill")?.querySelector(".htip")?.remove();
document.addEventListener("mouseover", e => { const g = e.target.closest?.(".hill .pt"); if (g) showHillTip(g); });
document.addEventListener("mouseout", e => { const g = e.target.closest?.(".hill .pt"); if (g && !g.contains(e.relatedTarget)) hideHillTip(g); });
document.addEventListener("focusin", e => { const g = e.target.closest?.(".hill .pt"); if (g) showHillTip(g); });
document.addEventListener("focusout", e => { const g = e.target.closest?.(".hill .pt"); if (g) hideHillTip(g); });

/* ---------------- feladat-kártya: felugró részletek (fix helyen a kártya mellett) ---------------- */
const VERDICT = {close:"Zárható", keep:"Megtartandó", merge:"Összevonható", backlog:"Backlogba", blocked:"Elakadtba", clarify:"Tisztázandó"};
const CMT = {};   // gid -> {state: "loading"|"ok"|"err", items: []}
let tcardEl = null, tcardGid = null, tcardTimer = null;
function currentNote(notes) {
  const n = (notes || "").trim(); if (!n) return "";
  const cut = n.split(/\n-{3,}\s*(ELŐZMÉNYEK|KORÁBBI|TÖRTÉNETI|MEGŐRZÖTT)[^\n]*/i)[0].split(/\n(Történeti|Korábbi|Megőrzött) [^\n]*:/)[0].trim();
  return cut.length > 600 ? cut.slice(0, 600).replace(/\s+\S*$/, "") + " …" : cut;
}
function commentHtml(gid) {
  const c = CMT[gid];
  if (!c) return AS.mode === "live" ? '<span class="hint">Kommentek betöltése…</span>' : '<span class="hint">Kommentek csak élő Asana-kapcsolattal.</span>';
  if (c.state === "loading") return '<span class="hint">Kommentek betöltése…</span>';
  if (c.state === "err") return '<span class="hint">A kommentek most nem tölthetők be.</span>';
  if (!c.items.length) return '<span class="hint">Nincs komment az Asanában.</span>';
  return c.items.slice(-3).map(x => `<div class="cm"><div class="hint">${esc(x.who || "")}${x.when ? " · " + esc(String(x.when).slice(0,10)) : ""}</div><div class="note">${esc(x.text)}</div></div>`).join("");
}
function tcardHtml(t) {
  const tn = page().task_notes?.tasks?.[t.gid];
  const note = currentNote(t.notes);
  return `<button class="pen tpen" type="button" data-pen="${esc(t.gid)}" title="Szerkesztés" aria-label="Feladat szerkesztése">${naIco("edit")}</button><h4>${esc(t.name || "(névtelen feladat)")}</h4>
    ${tn ? `<div class="sec" style="border-top:0;padding-top:0;margin-top:0"><div class="k">Miről szól <span class="verdict ${tn.verdict}">${VERDICT[tn.verdict]}</span></div><div>${esc(tn.about || "")}</div></div>
      <div class="sec"><div class="k">Claude javaslata</div><div>${esc(tn.suggestion)}</div><div class="src">Készült: ${esc(page().task_notes.generated || "")}, a leírás, a dosszié és a STATUS alapján</div></div>` : ""}
    ${note ? `<div class="sec"><div class="k">Asana-leírás (aktuális rész)</div><div class="note">${esc(note)}</div></div>` : ""}
    <div class="sec"><div class="k">Kommentek</div>${commentHtml(t.gid)}</div>`;
}
async function loadComments(t) {
  if (CMT[t.gid] || AS.mode !== "live") return;
  CMT[t.gid] = {state: "loading", items: []};
  try {
    const r = await AS.mcp.callTool("Asana", "get_task", {task_id: t.gid, include_subtasks: false, comment_limit: 20, opt_fields: "name"}, {cache: {staleTime: 120000}});
    const raw = r.payload?.data?.comments || r.payload?.comments || [];
    CMT[t.gid] = {state: "ok", items: raw.map(c => ({text: c.text || c.html_text?.replace(/<[^>]+>/g, "") || c.body || "", who: c.created_by?.name || c.author?.name || "", when: c.created_at || ""})).filter(x => x.text)};
  } catch { CMT[t.gid] = {state: "err", items: []}; }
  if (tcardGid === t.gid && tcardEl) tcardEl.innerHTML = tcardHtml(t);
  if (ED?.gid === t.gid) edComments();
}
function showTcard(card) {
  const t = tasksOf(page()).find(x => x.gid === card.dataset.task); if (!t) return;
  hideTcard(); tcardGid = t.gid;
  tcardEl = document.createElement("div"); tcardEl.className = "tcard"; tcardEl.setAttribute("role", "dialog"); tcardEl.innerHTML = tcardHtml(t);
  document.body.appendChild(tcardEl);
  tcardEl.addEventListener("mouseenter", () => clearTimeout(tcardTimer));
  tcardEl.addEventListener("mouseleave", ev => { if (!ev.relatedTarget?.closest?.(`[data-task="${CSS.escape(t.gid)}"]`)) tcardTimer = setTimeout(hideTcard, 250); });
  const r = card.getBoundingClientRect(), w = tcardEl.offsetWidth, h = tcardEl.offsetHeight;
  const g = card.classList.contains("mmn") ? 50 : 8;   // térképen a kártya melletti „+”, összekötő és összecsukó gombok szabadon maradnak
  const right = r.right + g + w <= innerWidth - 8, left = r.left - g - w >= 8;
  tcardEl.style.left = (right ? r.right + g : left ? r.left - g - w : Math.max(16, Math.min(r.left, innerWidth - w - 16))) + "px";
  tcardEl.style.top = (right || left ? Math.max(8, Math.min(r.top, innerHeight - h - 8)) : Math.min(r.bottom + 6, innerHeight - h - 8)) + "px";
  loadComments(t);
}
document.addEventListener("click", e => { const pn = e.target.closest?.("[data-pen]"); if (pn) { e.stopPropagation(); const g = pn.dataset.pen; hideTcard(); openEditor(g); } }, true);
function hideTcard() { clearTimeout(tcardTimer); tcardEl?.remove(); tcardEl = null; tcardGid = null; }
document.addEventListener("mouseover", e => {
  if (!matchMedia("(hover:hover)").matches || dragGid || ED || state.mmDrag || state.mm.input) return;
  if (e.target.closest?.(".mmadd, .mmlk, .mmtg, .urg, .mmbadge, .pen")) { clearTimeout(tcardTimer); if (tcardEl && !e.target.closest(".pen")) hideTcard(); return; }   // vezérlők fölött nincs részletkártya
  const card = e.target.closest?.(".card[data-task], .mmn[data-task]");
  if (card && card.dataset.task !== tcardGid) { clearTimeout(tcardTimer); tcardTimer = setTimeout(() => showTcard(card), 350); }
});
document.addEventListener("mouseout", e => {
  const card = e.target.closest?.(".card[data-task], .mmn[data-task]");
  if (card && !card.contains(e.relatedTarget)) { clearTimeout(tcardTimer); if (tcardGid === card.dataset.task && !e.relatedTarget?.closest?.(".tcard")) tcardTimer = setTimeout(hideTcard, 300); }
});
addEventListener("scroll", () => { if (tcardEl) hideTcard(); }, {passive: true});
document.addEventListener("dragstart", () => hideTcard());
document.addEventListener("click", e => {
  const b = e.target.closest?.("[data-tinfo]");
  if (b) { e.stopPropagation(); const card = b.closest(".card"); tcardGid === card.dataset.task ? hideTcard() : showTcard(card); return; }
  if (tcardEl && !e.target.closest(".tcard")) hideTcard();
}, true);

/* ---------------- feladat-szerkesztő oldalpanel + gyors határidő-módosítás ---------------- */
let ED = null;            // {gid, dirty, confirmClose, saving, sending}
let dueTimer = null;
const findTask = gid => tasksOf(page()).find(x => x.gid === gid);
const storeTask = gid => { for (const s of Object.values(AS.byProject)) { const x = s.tasks.find(t => t.gid === gid); if (x) return x; } return null; };
const unsureErr = err => err?.code === "server_unavailable" || err?.code === "upstream_error";

async function pushTask(t, upd, patch, okMsg) {
  if (AS.mode !== "live") { toast("Élő Asana-kapcsolat nélkül a módosítás nem ír vissza."); render(); return false; }
  const orig = storeTask(t.gid), before = orig ? {...orig} : null;
  if (orig) Object.assign(orig, patch);
  AS.busy.add(t.gid); render();
  try {
    const r = await AS.mcp.callTool("Asana", "update_tasks", {tasks: [{task: t.gid, ...upd}]});

/* mentés után: Claude megnézi, kell-e emiatt a projekt következő lépését, történetét vagy dokumentációját (md) frissíteni, és ha igen, megteszi */
async function taskFollowUp(P, t, before, d) {
  if (!(DB.ready && DB.canEdit) || !Object.keys(d).some(k => ["name", "section", "due_on", "start_on"].includes(k))) return;
  const sample = await window.claude?.use?.("sample").catch(() => null); if (!sample) return;
  const after = {name: t.name, section: d.section ?? before.section, due_on: "due_on" in d ? d.due_on : before.due_on, start_on: "start_on" in d ? d.start_on : before.start_on};
  const ctx = {project: P.portfolio.name, today: TODAY, next_step: curGate(P), goal: P.page.intro?.summary || "", task_before: before, task_after: after,
    open_tasks: tasksOf(P).filter(x => !x.completed).slice(0, 30).map(x => ({name: x.name, column: x.section_name, due_on: x.due_on}))};
  const prompt = `Egy projekt Asana-feladatát a projektgazda most módosította. Döntsd el, hogy emiatt frissíteni kell-e a projekt „következő lépés” szövegét, a projekt történetét (history.yaml) vagy a projekt dokumentációját (md, STATUS). Magyarul válaszolj.
Csak akkor javasolj bármit, ha a módosítás érdemben érinti a projekt állását (pl. feladat elkészült vagy elakadt, a következő lépéshez tartozó határidő változott). Apró átnevezés, sorrend vagy rutinmozgatás miatt ne. Ne találj ki dátumot, nevet, számot: csak a megadott adatokból dolgozz.
A „next_step” szövegében a „;” új pontot jelent, a **szó** kiemelést.
Csak JSON-t adj vissza: {"proposals": [{"type": "next_step", "text": "a teljes új következő-lépés szöveg"}, {"type": "note", "text": "rövid történet-bejegyzés"}, {"type": "repo_note", "text": "rövid, tényszerű, datált bejegyzés a dokumentációba"}]}. Ha nincs teendő: {"proposals": []}.

ADATOK:
${JSON.stringify(ctx)}`;
  try {
    const res = await sample.json(prompt, {modelTier: "default", cache: false});
    const done = [];
    for (const p of (Array.isArray(res?.proposals) ? res.proposals : []).slice(0, 3)) {
      if (p.type === "next_step" && p.text && p.text !== curGate(P)) { if (await saveGate(P, p.text)) done.push("következő lépés"); }
      else if (p.type === "note" && p.text) { await DB.db.collection("data/log/events").add({project: P.id, type: "note", text: p.text, by: DB.me, at: new Date().toISOString()}); done.push("történet"); }
      else if (p.type === "repo_note" && p.text) { await DB.db.collection("data/changes/events").add({project: P.id, target: "repo_note", value: p.text, by: DB.me, at: new Date().toISOString()}); done.push("dokumentáció"); }
    }
    if (done.length) { toast(`„${t.name}” módosítása miatt frissítve: ${done.join(", ")}. A repóba a következő szinkron írja.`); render(); }
  } catch {}
}

  const prev = curGate(P), ev = {project: P.id, target: "next_gate", value, prev, by: DB.me, at: new Date().toISOString()};
  try { await DB.db.collection("data/changes/events").add(ev); UPD.keys.add("gate:" + P.id); return true; } catch (err) { toast(`Nem sikerült menteni (${err?.code || "hiba"}).`); return false; }
}
async function npApply() {
  const P = page(), props = (npEl._props || []).filter((p, i) => npEl.querySelector(`[data-prop="${i}"]`)?.checked); if (!props.length) return;
  const btn = npEl.querySelector('[data-np="apply"]'); btn.disabled = true; btn.textContent = "Alkalmazom…";
  const done = [], fail = [];
  for (const p of props) {
    try {
      if (p.type === "next_step" && p.text) { if (await saveGate(P, p.text)) done.push("következő lépés"); else fail.push("következő lépés"); }
      else if (p.type === "repo_note" && p.text && DB.ready && DB.canEdit) { await DB.db.collection("data/changes/events").add({project: P.id, target: "repo_note", value: p.text, by: DB.me, at: new Date().toISOString()}); done.push("dokumentáció"); }
      else if (p.type === "note" && p.text && DB.ready && DB.canEdit) { await DB.db.collection("data/log/events").add({project: P.id, type: "note", text: p.text, by: DB.me, at: new Date().toISOString()}); done.push("történet"); }
      else if (p.type === "asana_create" && p.name) {
        if (AS.mode !== "live") throw {message: "nincs élő Asana"};
        const gid = P.page.asana.projects[0].gid, sec = (AS.sections[gid] || []).find(s => s.name === (p.column || "Következik")) || (AS.sections[gid] || []).find(s => s.name === "Következik");
        const task = {name: p.name, project_id: gid, assignee: "me"}; if (sec) task.section_id = sec.gid; if (p.due_on) task.due_on = p.due_on;
        const r = await AS.mcp.callTool("Asana", "create_tasks", {default_project: gid, tasks: [task]}); if ((r.payload?.failed || []).length) throw {message: "Asana elutasította"};
        UPD.names.add(p.name); done.push("új feladat: " + p.name);
      } else if (p.type === "asana_update" && p.gid) {
        const t = findTask(p.gid); if (!t) throw {message: "ismeretlen feladat"};
        const upd = {}, patch = {};
        if (p.due_on) { upd.due_on = p.due_on; patch.due_on = p.due_on; }
        if (p.completed === true || p.completed === false) { upd.completed = p.completed; patch.completed = p.completed; }
        if (p.column) { const sec = (AS.sections[t.project_gid] || []).find(s => s.name === p.column); if (sec) { upd.add_projects = [{project_id: t.project_gid, section_id: sec.gid}]; patch.section_gid = sec.gid; } }
        if (Object.keys(upd).length && await pushTask(t, upd, patch, "Asana frissítve.")) done.push("módosítás: " + t.name); else if (Object.keys(upd).length) fail.push(t.name);
      }
    } catch (err) { fail.push((p.name || p.type) + " (" + (err?.message || err?.code || "hiba") + ")"); }
  }
  AS.mcp?.invalidate("Asana", "get_tasks").catch(() => {});
  closeNp(); render();
  toast(`${done.length ? "Kész: " + done.join(", ") + "." : ""}${fail.length ? " Nem sikerült: " + fail.join(", ") + "." : ""}`);
}
async function npDraft() {

async function npTask() {

/* ---------------- hill húzás ---------------- */
/* a mozgatás magától rögzül 30 mp múlva (a leírás nem kötelező); gépelés közben az óra újraindul */
const HILL_AUTO = 30;
function hillCdText() { const mv = state.hillMove; if (!mv?.due) return ""; const left = Math.max(0, Math.ceil((mv.due - Date.now()) / 1000)); return `${left} mp múlva magától rögzül, mindenhol. Repó-szinkronig a felületen él, utána a history.yaml-ba kerül.`; }
function hillArm() { const mv = state.hillMove; if (!mv) return; mv.due = Date.now() + HILL_AUTO * 1000; clearInterval(HILLT.iv);
  HILLT.iv = setInterval(() => { const cur = state.hillMove; if (cur !== mv) { clearInterval(HILLT.iv); return; }
    const el = document.getElementById("hcd"); if (el) el.textContent = hillCdText(); if (Date.now() >= mv.due) { clearInterval(HILLT.iv); saveHill(); } }, 1000); }
const HILLT = {iv: null};
document.addEventListener("input", e => { if (e.target.id === "hnote" && state.hillMove) { state.hillMove.note = e.target.value; hillArm(); } });
function wireHill() {
  if (!(DB.ready && DB.canEdit)) return;
  for (const svg of document.querySelectorAll("#hillbig, #hillmini")) svg.addEventListener("dblclick", ev => {   // dupla kattintás a görbén: új munkaszál (pötty) ott
    if (ev.target.closest(".pt")) return;
    const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * HW, pos = Math.round(Math.max(0, Math.min(100, (vx - HX0) / (HX1 - HX0) * 100)));
    state.hillAdd = {where: svg.id, pos, pid: state.pid, fx: hx(pos) / HW, fy: (hillY(pos) - 20) / HH}; render();
    const inp = document.querySelector("[data-hilladd]"); inp?.focus();
  });
  for (const svg of document.querySelectorAll("#hillbig, #hillmini")) svg.querySelectorAll(".pt").forEach(g => g.addEventListener("pointerdown", ev => {
    ev.preventDefault(); hideHillTip(g);
    if (state.hillMove?.due) saveHill();   /* egy függőben lévő másik mozgatás előbb rögzül */
    const scope = g.dataset.scope, from = hillPositions(page())[scope]?.position ?? 0;
    const toX = cx => { const r = svg.getBoundingClientRect(), vx = (cx - r.left) / r.width * HW; return Math.max(0, Math.min(100, (vx - HX0) / (HX1 - HX0) * 100)); };
    state.hillMove = {scope, from, to: from, where: svg.id, pid: state.pid};
    const onMove = e2 => { state.hillMove.to = Math.round(toX(e2.clientX)); g.setAttribute("transform", `translate(${hx(state.hillMove.to).toFixed(1)},${hillY(state.hillMove.to).toFixed(1)})`); g.classList.add("drag"); };
    const onUp = () => { removeEventListener("pointermove", onMove); removeEventListener("pointerup", onUp);
      if (Math.abs(state.hillMove.to - from) < 1) { state.hillMove = null; render(); return; } hillArm(); render(); };
    addEventListener("pointermove", onMove); addEventListener("pointerup", onUp);
  }));
}

  if (e.key === "Enter") { e.preventDefault(); hillRenSave(e.target.value.trim()); }
