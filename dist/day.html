}, true);
document.addEventListener("input", e => { if (e.target.matches?.("[data-hillren]") && state.hillRen) state.hillRen.value = e.target.value; });
document.addEventListener("focusout", e => { if (e.target.matches?.("[data-hillren]")) setTimeout(() => { const el = document.querySelector("[data-hillren]"); if (state.hillRen && document.activeElement !== el) hillRenSave((el?.value ?? state.hillRen.value ?? "").trim()); }, 120); });
async function hillRenSave(label) {
  const r = state.hillRen; state.hillRen = null; const P = page(), s = r && hillScopes(P).find(x => x.id === r.id);
  if (!s || !label || label === s.label) { render(); return; }
  if (hillScopes(P).some(x => x.id !== s.id && x.label.trim().toLowerCase() === label.toLowerCase())) { render(); toast(`Már van ilyen munkaszál: „${label}”.`); return; }
  try {
    await DB.db.collection("data/hill/events").add({project: P.id, kind: "rename", scope: s.id, label, prev: s.label, note: `Munkaszál átnevezve: „${s.label}” → „${label}”`, by: DB.me, at: new Date().toISOString()});
    UPD.names.add(label); render(); toast(`Átnevezve: „${label}”. A repó-szinkron a projektlapra is átvezeti.`);
    if (AS.mode === "live") {   // a régi névvel besorolt feladatok az új névre kerülnek, hogy a térképen a munkaszál alatt maradjanak
      const byPg = {};
      for (const ap of P.page.asana?.projects || []) { const fid = AS.mmField[ap.gid]; if (!fid) continue;
        for (const t of AS.byProject[ap.gid]?.tasks || []) if ((t.munkaszal || "").trim() === s.label.trim()) { t.munkaszal = label; (byPg[fid] ||= []).push({task: t.gid, custom_fields: {[fid]: label}}); } }
      const ups = Object.values(byPg).flat();
      for (let i = 0; i < ups.length; i += 50) await AS.mcp.callTool("Asana", "update_tasks", {tasks: ups.slice(i, i + 50)}).catch(err => toast(`A „Munkaszál” mező átírása az Asanában nem sikerült: ${err?.message || err?.code}`));
      if (ups.length) render();
    }
  } catch (err) { render(); toast(err?.code === "invalid_argument" ? "Ehhez szerkesztői jog kell." : `Nem sikerült átnevezni (${err?.code || "ismeretlen hiba"}).`); }
}
async function hillAddSave(label) {
  const a = state.hillAdd; state.hillAdd = null; if (!a || !label) { render(); return; }
  const P = D.pages.find(p => p.id === a.pid), id = "u-" + Date.now().toString(36);
  if (hillScopes(P).some(x => x.label.trim().toLowerCase() === label.toLowerCase())) { render(); toast(`Már van ilyen munkaszál: „${label}”.`); return; }
  try { await DB.db.collection("data/hill/events").add({project: a.pid, kind: "scope", scope: id, label, position: a.pos, from: null, note: `Új munkaszál a hill charton: ${label}`, by: DB.me, at: new Date().toISOString()});
    render(); toast(`Új munkaszál: „${label}”. A repó-szinkron felveszi a projektlapra.`); }
  catch (err) { render(); toast(err?.code === "invalid_argument" ? "Ehhez szerkesztői jog kell." : `Nem sikerült felvenni (${err?.code || "ismeretlen hiba"}).`); }
}
document.addEventListener("keydown", e => {
  if (!e.target.matches?.("[data-hilladd]")) return;
  if (e.key === "Enter") { e.preventDefault(); hillAddSave(e.target.value.trim()); }
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); state.hillAdd = null; render(); }
}, true);
document.addEventListener("input", e => { if (e.target.matches?.("[data-hilladd]") && state.hillAdd) state.hillAdd.value = e.target.value; });
document.addEventListener("focusout", e => { if (e.target.matches?.("[data-hilladd]")) setTimeout(() => { if (state.hillAdd && document.activeElement !== document.querySelector("[data-hilladd]")) hillAddSave(document.querySelector("[data-hilladd]")?.value.trim() || ""); }, 120); });
async function saveHill() {
  const mv = state.hillMove; if (!mv) return; clearInterval(HILLT.iv);
  const note = (document.getElementById("hnote")?.value ?? mv.note ?? "").trim() || `Áthelyezve a hill charton: ${Math.round(mv.from)} → ${Math.round(mv.to)} (leírás nélkül)`;
  if (state.saving) return;
  state.saving = true; const btn = document.querySelector('[data-act="hill-save"]'); if (btn) { btn.disabled = true; btn.textContent = "Mentés…"; }
  try {
    await DB.db.collection("data/hill/events").add({project: mv.pid || state.pid, scope: mv.scope, position: mv.to, from: mv.from, note, by: DB.me, at: new Date().toISOString()});
    if (state.hillMove === mv) state.hillMove = null; render(); toast("Rögzítve. A következő repó-szinkronnál a history.yaml-ba kerül.");
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "Rögzítem most"; }
    toast(err?.code === "invalid_argument" ? "Ehhez szerkesztői jog kell." : `A mentés nem sikerült (${err?.code || "ismeretlen hiba"}). Próbáld újra.`);
  } finally { state.saving = false; }
}

/* ---------------- Asana: élő olvasás és írás ---------------- */
const FIELDS = "name,notes,completed,completed_at,due_on,start_on,created_at,dependencies.gid,assignee.name,assignee.gid,custom_fields.gid,custom_fields.name,custom_fields.display_value,memberships.section.name,memberships.section.gid,memberships.project.gid,tags.name";
function normalize(pgid, payload) {
  return (payload?.data || []).map(t => {
    const m = (t.memberships || []).find(x => x.project?.gid === pgid) || {};
    return {gid:t.gid, name:t.name, notes:t.notes || "", completed:!!t.completed, completed_at:t.completed_at || null, due_on:t.due_on || null, start_on:t.start_on || null, section_gid:m.section?.gid || null, tags:(t.tags || []).map(x => x.name), assignee:t.assignee?.name || null, assignee_gid:t.assignee?.gid || null, dependencies:(t.dependencies || []).map(d => d.gid), created_at:t.created_at ? t.created_at.slice(0,10) : null,
      munkaszal:(t.custom_fields || []).find(f => MM_FIELD_RE.test(f.name || ""))?.display_value || ""};
  });
}
async function startAsana(retry) {
  const cl = window.claude;
  const mcp = cl?.use ? await cl.use("mcp").catch(() => null) : null;
  if (!mcp) { AS.mode = "error"; AS.err = {code:"nomcp"}; render(); return; }
  AS.mcp = mcp; AS.mode = "init"; render();
  const gids = [...new Set(D.pages.flatMap(p => (p.page.asana?.projects || []).map(a => a.gid)))];
  for (const gid of gids) {
    try {
      const pr = await mcp.callTool("Asana", "get_project", {project_id: gid, include_sections: true, opt_fields: "name,custom_field_settings.custom_field.gid,custom_field_settings.custom_field.name,custom_field_settings.custom_field.resource_subtype"}, {cache: {staleTime: 60000}});
      AS.sections[gid] = (pr.payload?.data?.sections || []).map(s => ({gid: s.gid, name: s.name}));
      const cf = (pr.payload?.data?.custom_field_settings || []).map(s => s.custom_field || {}).find(f => MM_FIELD_RE.test(f.name || "") && (!f.resource_subtype || f.resource_subtype === "text"));
      AS.mmField[gid] = cf?.gid || null;
    } catch (err) { AS.mode = "error"; AS.err = err; render(); if (err?.retryable && !retry) setTimeout(() => startAsana(true), 1500 + Math.random() * 1500); return; }
    mcp.watchTool("Asana", "get_tasks", {project: gid, limit: 100, opt_fields: FIELDS}, ev => {
      if (ev.type === "data") { const ts = normalize(gid, ev.result.payload), seen = new Set(ts.map(t => t.gid));
        AS.opt[gid] = (AS.opt[gid] || []).filter(t => !seen.has(t.gid) && Date.now() - t.t0 < 300000); ts.push(...AS.opt[gid]);   // a friss lista még nem tartalmazhatja az épp létrehozottat
        AS.byProject[gid] = {tasks: ts, sections: AS.sections[gid]}; AS.mode = "live"; AS.err = null;
        AS.fetchedAt = Math.max(AS.fetchedAt || 0, ev.result.cache?.storedAt ? Date.parse(ev.result.cache.storedAt) || Date.now() : Date.now()); AS.refreshing = false; freshUi(); }
      else if (["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy","selection_required"].includes(ev.error.code)) { delete AS.byProject[gid]; AS.mode = "error"; AS.err = ev.error; }
      else if (!AS.byProject[gid]) { AS.mode = "error"; AS.err = ev.error; }
      if (!dragGid && !state.hillMove && !state.newTask && !state.inlineDue && !mmBusy() && !state.tlDrag && !state.planEdit) render();
    }, {refetchInterval: 120000});
  }
}
async function moveTask(t, colName) {
  if (AS.mode !== "live") { toast("Élő Asana-kapcsolat nélkül az áthelyezés nem ír vissza."); render(); return; }
  const sec = (AS.sections[t.project_gid] || []).find(s => s.name === colName);
  if (!sec) { toast(`Nincs „${colName}” szekció az Asana-projektben.`); render(); return; }
  const upd = {task: t.gid, add_projects: [{project_id: t.project_gid, section_id: sec.gid}]};
  if (colName === "Kész" && !t.completed) upd.completed = true;
  if (colName !== "Kész" && t.completed) upd.completed = false;
  const store = AS.byProject[t.project_gid], orig = store.tasks.find(x => x.gid === t.gid), before = {...orig};
  Object.assign(orig, {section_gid: sec.gid, completed: upd.completed ?? orig.completed});
  AS.busy.add(t.gid); render();
  try {
    const r = await AS.mcp.callTool("Asana", "update_tasks", {tasks: [upd]});
    if ((r.payload?.failed || []).length) throw {code: "tool_error", message: r.payload.failed[0]?.errors?.[0]?.message || "Az Asana nem fogadta el a módosítást."};
    toast(`Áthelyezve az Asanában: ${colName}`);
    AS.mcp.invalidate("Asana", "get_tasks").catch(() => {});
  } catch (err) {
    Object.assign(orig, before);
    toast(err?.code === "server_unavailable" || err?.code === "upstream_error" ? "Az Asana nem válaszolt; nem biztos, hogy átkerült. Frissítés után ellenőrizd." : `Nem sikerült: ${err?.message || err?.code}`);
    if (err?.code === "server_unavailable" || err?.code === "upstream_error") AS.mcp.invalidate("Asana", "get_tasks").catch(() => {});
  } finally { AS.busy.delete(t.gid); render(); }
}

async function createTask() {
  const P = page(), nt = state.newTask; if (!nt || state.creating) return;
  const name = document.getElementById("nt-name")?.value.trim(), due = document.getElementById("nt-due")?.value || null;
  if (!name) return;
  const gid = document.getElementById("nt-proj")?.value || P.page.asana.projects[0].gid;
  const sec = (AS.sections[gid] || []).find(s => s.name === nt.col);
  if (!sec) { toast(`Nincs „${nt.col}” szekció az Asana-projektben.`); return; }
  state.creating = true; const btn = document.querySelector("[data-ntform] [type=submit]"); if (btn) { btn.disabled = true; btn.textContent = "Létrehozás…"; }
  const task = {name, project_id: gid, section_id: sec.gid, assignee: "me"};
  if (due) { task.due_on = due; if (due >= TODAY) task.start_on = TODAY; }   // a kezdés alapból a mai nap (Asana csak határidővel együtt fogadja el)
  if (nt.col === "Kész") task.completed = true;
  try {
    const r = await AS.mcp.callTool("Asana", "create_tasks", {default_project: gid, tasks: [task]});
    if ((r.payload?.failed || []).length) throw {code: "tool_error", message: r.payload.failed[0]?.error || r.payload.failed[0]?.errors?.[0]?.message || "Az Asana nem hozta létre a feladatot."};
    state.newTask = null; render(); toast(`Létrehozva az Asanában: ${name}`);
    AS.mcp.invalidate("Asana", "get_tasks").catch(() => {});
    if (DB.ready && DB.canEdit) DB.db.collection("data/log/events").add({project: P.id, type: "note", text: `Új Asana-feladat (${nt.col}): ${name}${due ? ", határidő " + due : ""}`, by: DB.me, at: new Date().toISOString()}).catch(() => {});
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "Létrehozás"; }
    toast(err?.code === "server_unavailable" || err?.code === "upstream_error" ? "Az Asana nem válaszolt; nem biztos, hogy létrejött. Frissítés után ellenőrizd, mielőtt újra próbálod." : `Nem sikerült: ${err?.message || err?.code}`);
    if (err?.code === "server_unavailable" || err?.code === "upstream_error") AS.mcp.invalidate("Asana", "get_tasks").catch(() => {});
  } finally { state.creating = false; }
}

/* ---------------- tartós tár: hill-mozgatások ---------------- */
async function startDb() {
  const cl = window.claude; const db = cl?.use ? await cl.use("db").catch(() => null) : null; if (!db) return;
  const user = await cl.use("user").catch(() => null);
  DB.db = db; DB.ready = true;
  cl.use("assets").then(x => { ASSETS.api = x || null; if (x && state.tab === "docs") render(); }).catch(() => {});   // Docs: fájlfeltöltés (csak szerkesztőnek)
  DB.canEdit = (await user?.canEdit?.().catch(() => false)) || false;
  DB.me = (await user?.id?.().catch(() => null)) || null;
  db.collection("data/hill/events").orderBy("at").onSnapshot(async q => {
    DB.events = q.docs.map(d => d.data());
    const ids = [...new Set(DB.events.map(e => e.by).filter(Boolean))];
    if (ids.length && user?.profiles) { const ps = await user.profiles(ids).catch(() => ({})); for (const id of ids) DB.names[id] = ps?.[id]?.name || ""; }
    if (!state.hillMove) render();
  }, () => {});
  db.collection("data/changes/events").orderBy("at").onSnapshot(q => { CHG.events = q.docs.map(d => d.data()); if (!npEl && !state.planEdit && !state.hillMove) render(); }, () => {});
  db.collection("data/plan/events").orderBy("at").onSnapshot(q => { PLAN.events = q.docs.map(d => d.data()); if (state.tab === "progress" && !state.planEdit && !state.hillMove) render(); }, () => {});
  db.collection("data/mindmap/nodes").onSnapshot(q => {
    MM.docs = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); MM.ready = true;
    if (mmActive() && !mmBusy() && !state.hillMove) render();
  }, () => {});
  db.collection("data/plan/focus").onSnapshot(q => { FOC.docs = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); if (state.mode === "person" && !state.focDone) render(); }, () => {});
  db.collection("data/plan/day").onSnapshot(q => {   // napi terv (Ma fül): dokumentum naponta
    DAY.all = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); DAY.ready = true;
    if (DAY.all[TODAY] && !(DAY.doc && (DAY.doc.at || "") > (DAY.all[TODAY].at || ""))) DAY.doc = JSON.parse(JSON.stringify(DAY.all[TODAY]));
    if (state.mode === "day" && !dayDrag && !state.dayEdit) render();
  }, () => {});
  db.collection("data/log/events").orderBy("at").onSnapshot(q => { DB.log = q.docs.map(d => d.data()); if (!state.hillMove && !state.newTask) render(); }, () => {});
  render();
}

render();
startAsana(false);
startDb();
</script>
